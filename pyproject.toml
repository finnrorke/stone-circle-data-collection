[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-collection"
version = "0.1.0"
description = "Stage 1 dataset collection pipeline for raw UK megalith-related heritage datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.24,<0.29",
  "pydantic>=2.10,<3.0",
  "pyogrio>=0.10,<0.13",
  "pyproj>=3.6,<4.0",
  "shapely>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
